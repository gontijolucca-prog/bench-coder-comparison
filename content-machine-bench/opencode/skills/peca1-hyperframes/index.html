<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>TechBody EMS — Recrutamento Muscular</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #1a1a1a;
      }
      body {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        color: #ffffff;
      }
      .mono { font-family: "JetBrains Mono", "Courier New", monospace; }

      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #1a1a1a;
      }

      .clip { position: absolute; inset: 0; }

      /* Top eyebrow brand */
      .brand {
        position: absolute;
        top: 64px;
        left: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
        opacity: 0;
      }
      .brand .dot {
        width: 14px;
        height: 14px;
        background: #d4773b;
        border-radius: 50%;
      }
      .brand .label {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      /* Bottom progress bar */
      .progress-track {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 32px;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: #d4773b;
      }
      .progress-meta {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 56px;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        opacity: 0;
      }

      /* Big number */
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .big-number {
        font-size: 380px;
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.04em;
        color: #d4773b;
        transform: scale(0.6);
        opacity: 0;
        text-shadow: 0 8px 60px rgba(212, 119, 59, 0.25);
      }
      .big-number .pct {
        font-size: 0.5em;
        font-weight: 600;
        margin-left: 8px;
        color: #ffffff;
        opacity: 0.85;
      }

      /* Comparison bars */
      .bars {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 380px;
        display: flex;
        flex-direction: column;
        gap: 48px;
        opacity: 0;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .bar-label {
        width: 200px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .bar-label .num {
        display: block;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
        margin-bottom: 4px;
      }
      .bar-label .num.dim { color: rgba(255, 255, 255, 0.45); }
      .bar-label .num.bright { color: #d4773b; }
      .bar-label .tag {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
      }
      .bar-track {
        flex: 1;
        height: 28px;
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }
      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: rgba(255, 255, 255, 0.25);
      }
      .bar-fill.bright {
        background: #d4773b;
        box-shadow: 0 0 24px rgba(212, 119, 59, 0.4);
      }

      /* Headline */
      .headline {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 760px;
        text-align: center;
        opacity: 0;
      }
      .headline .kicker {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #d4773b;
        margin-bottom: 14px;
      }
      .headline .line {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }
      .headline .line em {
        font-style: normal;
        color: #d4773b;
      }

      /* Rule lines decoration */
      .rule {
        position: absolute;
        background: rgba(255, 255, 255, 0.08);
      }
      .rule-h1 { top: 200px; left: 64px; right: 64px; height: 1px; }
      .rule-h2 { top: 380px; left: 64px; right: 64px; height: 1px; }

      /* Caption */
      .caption {
        position: absolute;
        top: 232px;
        left: 80px;
        right: 80px;
        text-align: left;
        opacity: 0;
      }
      .caption .h {
        font-size: 64px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin-bottom: 18px;
      }
      .caption .h em { font-style: normal; color: #d4773b; }
      .caption .sub {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.7);
        max-width: 720px;
        line-height: 1.35;
      }

      .timecode {
        position: absolute;
        right: 64px;
        top: 64px;
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.1em;
color: rgba(255, 255, 255, 0.6);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1080"
    >
      <!-- Persistent progress + brand chrome -->
      <div id="brand-chrome" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div class="brand" id="brand">
          <div class="dot"></div>
          <div class="label">TechBody</div>
        </div>
        <div class="timecode mono" id="timecode">00:00</div>
        <div class="rule rule-h1"></div>
        <div class="rule rule-h2"></div>
        <div class="progress-meta" id="progress-meta">
          <span>EMS · Recrutamento Muscular</span>
          <span class="mono" id="timecode-meta">00:00 / 00:10</span>
        </div>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <!-- Scene 1: 0 - 2.2s — Caption + headline -->
      <div id="scene-1" class="clip" data-start="0" data-duration="2.2" data-track-index="1">
        <div class="caption" id="caption-1">
          <div class="h">A electroestimulação <em>recruta</em> fibras musculares.</div>
          <div class="sub">Comparação direta entre treino clássico e sessão assistida por EMS.</div>
        </div>
      </div>

      <!-- Scene 2: 2.0 - 5.5s — Bars comparison -->
      <div id="scene-2" class="clip" data-start="2.0" data-duration="3.5" data-track-index="2">
        <div class="bars" id="bars">
          <div class="bar-row">
            <div class="bar-label">
              <span class="num dim">30–40%</span>
              <span class="tag">Treino clássico</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" id="bar-classic"></div>
            </div>
          </div>
          <div class="bar-row">
            <div class="bar-label">
              <span class="num bright">85–90%</span>
              <span class="tag">Sessão EMS</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill bright" id="bar-ems"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Scene 3: 5.0 - 7.5s — Big number grows -->
      <div id="scene-3" class="clip" data-start="5.0" data-duration="2.5" data-track-index="3">
        <div class="stage">
          <div class="big-number" id="big-number" data-layout-allow-overflow="true">
            85–90<span class="pct">%</span>
          </div>
        </div>
      </div>

      <!-- Scene 4: 7.2 - 10s — Final headline -->
      <div id="scene-4" class="clip" data-start="7.2" data-duration="2.8" data-track-index="4">
        <div class="headline" id="headline">
          <div class="kicker">Fibras activadas por sessão</div>
          <div class="line">EMS recruta até <em>85–90%</em><br/>das fibras musculares.</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Helper: pad timecode
      function pad(n) { return String(n).padStart(2, "0"); }
      function fmt(s) {
        const m = Math.floor(s / 60);
        const r = Math.floor(s % 60);
        return pad(m) + ":" + pad(r);
      }

      const tl = gsap.timeline({ paused: true });

      // Brand + chrome — fade in immediately, persist
      tl.fromTo("#brand", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#timecode", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.fromTo("#progress-meta", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo("#progress-track", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.4);

      // Scene 1: caption
      tl.fromTo("#caption-1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.fromTo("#caption-1 .h", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.fromTo("#caption-1 .sub", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.7);

      // Scene 2: bars reveal + fill
      tl.fromTo("#bars", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.0);
      tl.fromTo("#bar-classic", { width: "0%" }, { width: "35%", duration: 1.4, ease: "power2.inOut" }, 2.4);
      tl.fromTo("#bar-ems",     { width: "0%" }, { width: "87%", duration: 1.6, ease: "power3.inOut" }, 2.7);

      // Scene 3: big number scales in
      tl.fromTo("#big-number", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 1.2, ease: "back.out(1.4)" }, 5.0);
      tl.to("#big-number", { scale: 1.02, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.4);

      // Scene 4: headline
      tl.fromTo("#headline", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.2);
      tl.fromTo("#headline .kicker", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 7.3);
      tl.fromTo("#headline .line",   { opacity: 0, y: 12 },  { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.5);

      // Progress bar fills linearly across the whole 10s
      tl.fromTo("#progress-fill", { width: "0%" }, { width: "100%", duration: 10, ease: "none" }, 0);

      // Timecode text (deterministic — no Date.now)
      tl.call(() => { /* placeholder for any non-critical update */ }, [], 0);

      // Set up a periodic deterministic timecode refresh using an onUpdate
      // driven by a tween of an internal counter (no real clock).
      const counter = { v: 0 };
      tl.to(counter, {
        v: 10,
        duration: 10,
        ease: "none",
        onUpdate: () => {
          const tc = fmt(counter.v);
          const tcm = document.getElementById("timecode-meta");
          const tct = document.getElementById("timecode");
          if (tcm) tcm.textContent = tc + " / 00:10";
          if (tct) tct.textContent = tc;
        }
      }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
