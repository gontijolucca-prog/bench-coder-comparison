<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>TechBody EMS — Recrutamento Muscular</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #1a1a1a;
        --accent: #d4773b;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.55);
        --track: rgba(255, 255, 255, 0.12);
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }
      #scene-fill {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 50% at 50% 35%, rgba(212, 119, 59, 0.12), transparent 70%),
          linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 72px;
      }
      .clip.center {
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .clip.top {
        justify-content: flex-start;
        align-items: stretch;
      }
      .bars {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
        margin-top: 56px;
      }
      .bar-row { display: flex; flex-direction: column; gap: 14px; width: 100%; }
      .bar-label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 26px;
        font-weight: 200;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }
      .bar-label .name { font-weight: 800; color: var(--text); }
      .bar-label .value { font-family: "JetBrains Mono", monospace; font-weight: 800; }
      .bar-label .value.accent { color: var(--accent); }
      .bar-track {
        position: relative;
        width: 100%;
        height: 18px;
        background: var(--track);
        overflow: hidden;
      }
      .bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0;
        background: var(--accent);
        display: block;
      }
      .bar-fill.muted { background: rgba(255, 255, 255, 0.35); }
      .huge {
        font-size: 240px;
        line-height: 0.95;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.04em;
        margin: 0;
        white-space: nowrap;
      }
      .huge .accent { color: var(--accent); }
      .lead {
        font-size: 36px;
        font-weight: 200;
        color: var(--text);
        margin-top: 28px;
        max-width: 800px;
      }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.32em;
        color: var(--accent);
        margin-bottom: 28px;
      }
      .accent-rule {
        width: 96px;
        height: 6px;
        background: var(--accent);
        margin: 0 0 32px 0;
        display: block;
      }
      .accent-rule.center { margin-left: auto; margin-right: auto; }
      .footer {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--muted);
      }
      .meta-row .brand { color: var(--text); font-weight: 800; letter-spacing: 0.32em; }
      .progress-track {
        position: relative;
        width: 100%;
        height: 4px;
        background: var(--track);
        overflow: hidden;
      }
      .progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0;
        background: var(--accent);
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1080"
    >
      <div id="scene-fill"></div>

      <section
        id="scene-bars"
        class="clip top"
        data-start="0"
        data-duration="5"
        data-track-index="1"
      >
        <div class="accent-rule" id="rule-bars"></div>
        <p class="eyebrow" id="eyebrow-bars">Recrutamento Muscular</p>
        <div class="bars" id="bars-block">
          <div class="bar-row">
            <div class="bar-label">
              <span class="name">Treino clássico</span>
              <span class="value" id="value-conv">30-40%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill muted" id="fill-conv"></div>
            </div>
          </div>
          <div class="bar-row">
            <div class="bar-label">
              <span class="name">Electroestimulação</span>
              <span class="value accent" id="value-ems">85-90%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" id="fill-ems"></div>
            </div>
          </div>
        </div>
      </section>

      <section
        id="scene-number"
        class="clip center"
        data-start="4"
        data-duration="5"
        data-track-index="2"
      >
        <div class="accent-rule center" id="rule-num"></div>
        <p class="eyebrow" id="eyebrow-num">EMS</p>
        <h1 class="huge" id="huge-num">85<span class="accent">-</span>90<span class="accent">%</span></h1>
        <p class="lead" id="lead-num">
          Electroestimulação recruta até 85-90% das fibras musculares numa sessão
          de baixo impacto articular.
        </p>
      </section>

      <section
        id="scene-close"
        class="clip center"
        data-start="9"
        data-duration="1"
        data-track-index="3"
      >
        <p
          class="eyebrow"
          id="close-line"
          style="font-size: 36px; letter-spacing: 0.42em;"
        >
          20-25 min &middot; 1 a 3x por semana
        </p>
      </section>

      <div class="footer" id="footer">
        <div class="meta-row">
          <span class="brand mono">TECHBODY</span>
          <span class="mono" id="timecode">00:00 / 00:10</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const ROOT_DURATION = 10;
      const tl = gsap.timeline({ paused: true });

      tl.from("#rule-bars",    { scaleX: 0, transformOrigin: "left center", duration: 0.5, ease: "power3.out" }, 0.1);
      tl.from("#eyebrow-bars", { opacity: 0, y: 12, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.from("#fill-conv",    { width: 0, duration: 0.9, ease: "power2.out" }, 0.6);
      tl.from("#fill-ems",     { width: 0, duration: 1.1, ease: "power3.out" }, 0.9);
      tl.from("#value-conv",   { opacity: 0, duration: 0.4, ease: "none" }, 1.4);
      tl.from("#value-ems",    { opacity: 0, duration: 0.4, ease: "none" }, 1.7);

      tl.from("#rule-num",    { scaleX: 0, transformOrigin: "center center", duration: 0.5, ease: "power3.out" }, 4.0);
      tl.from("#eyebrow-num", { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, 4.1);
      tl.from("#huge-num",    { scale: 0.6, opacity: 0, duration: 0.9, ease: "back.out(1.2)" }, 4.2);
      tl.from("#lead-num",    { opacity: 0, y: 16, duration: 0.7, ease: "power2.out" }, 5.4);

      tl.from("#close-line", { opacity: 0, y: 8, duration: 0.5, ease: "power2.out" }, 9.0);

      tl.from("#progress-fill", { width: 0, duration: ROOT_DURATION, ease: "none" }, 0);

      const tcEl = document.getElementById("timecode");
      tl.call(() => { tcEl.textContent = "00:00 / 00:10"; }, [], 0);
      tl.call(() => { tcEl.textContent = "00:02 / 00:10"; }, [], 2);
      tl.call(() => { tcEl.textContent = "00:04 / 00:10"; }, [], 4);
      tl.call(() => { tcEl.textContent = "00:06 / 00:10"; }, [], 6);
      tl.call(() => { tcEl.textContent = "00:08 / 00:10"; }, [], 8);
      tl.call(() => { tcEl.textContent = "00:10 / 00:10"; }, [], 10);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
