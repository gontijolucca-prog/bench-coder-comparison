<!doctype html>
<html lang="pt-PT" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #1a1a1a;
        --accent: #d4773b;
        --white: #ffffff;
        --muted: #a5a5a5;
        --line: rgba(255, 255, 255, 0.14);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        color: var(--white);
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-variant-numeric: tabular-nums;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px),
          radial-gradient(circle at 50% 42%, rgba(212, 119, 59, 0.14), transparent 37%),
          var(--bg);
        background-size: 90px 90px, 90px 90px, auto, auto;
      }

      .clip {
        position: absolute;
      }

      .brand {
        top: 68px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--white);
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 20px;
        height: 20px;
        border: 5px solid var(--accent);
        transform: rotate(45deg);
      }

      .eyebrow {
        top: 135px;
        left: 72px;
        color: var(--accent);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .metric {
        top: 190px;
        left: 72px;
        right: 72px;
        display: flex;
        justify-content: center;
        align-items: baseline;
        color: var(--white);
        font-size: 204px;
        font-weight: 850;
        letter-spacing: -0.085em;
        line-height: 0.95;
        text-align: center;
      }

      .metric-unit {
        margin-left: 12px;
        color: var(--accent);
        font-size: 75px;
        letter-spacing: -0.04em;
      }

      .metric-label {
        top: 412px;
        left: 72px;
        right: 72px;
        color: var(--muted);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-align: center;
        text-transform: uppercase;
      }

      .chart {
        top: 500px;
        left: 96px;
        width: 888px;
        padding: 38px 40px 34px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(26, 26, 26, 0.82);
      }

      .row + .row {
        margin-top: 32px;
      }

      .row-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 13px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .row-head span:first-child {
        color: var(--muted);
      }

      .row-head strong {
        color: var(--white);
        font-size: 24px;
      }

      .bar-track {
        width: 100%;
        height: 24px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.09);
      }

      .bar-fill {
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
      }

      .bar-conventional {
        width: 40%;
        background: #6c6c6c;
      }

      .bar-ems {
        width: 90%;
        background: var(--accent);
        box-shadow: 0 0 28px rgba(212, 119, 59, 0.34);
      }

      .statement {
        left: 96px;
        right: 96px;
        bottom: 126px;
        font-size: 44px;
        font-weight: 760;
        letter-spacing: -0.035em;
        line-height: 1.1;
        text-align: center;
      }

      .statement em {
        color: var(--accent);
        font-style: normal;
      }

      .footer {
        left: 72px;
        right: 72px;
        bottom: 51px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .progress {
        left: 0;
        bottom: 0;
        width: 1080px;
        height: 9px;
        background: rgba(255, 255, 255, 0.1);
      }

      .progress-fill {
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <main
      id="root"
      data-composition-id="techbody-ems"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1080"
    >
      <div id="brand" class="brand clip" data-start="0" data-duration="10" data-track-index="1">
        <span class="brand-mark"></span>
        <span>TechBody</span>
      </div>

      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="10" data-track-index="2">
        Recrutamento muscular com EMS
      </div>

      <div id="metric" class="metric clip" data-start="0" data-duration="10" data-track-index="3">
        <span id="metric-value">0</span><span class="metric-unit">%</span>
      </div>

      <div id="metric-label" class="metric-label clip" data-start="0" data-duration="10" data-track-index="4">
        das fibras musculares recrutadas
      </div>

      <section id="recruitment-chart" class="chart clip" data-start="0" data-duration="10" data-track-index="5">
        <div class="row">
          <div class="row-head">
            <span>Treino convencional</span>
            <strong>30–40%</strong>
          </div>
          <div class="bar-track"><div id="bar-conventional" class="bar-fill bar-conventional"></div></div>
        </div>
        <div class="row">
          <div class="row-head">
            <span>Treino EMS</span>
            <strong>85–90%</strong>
          </div>
          <div class="bar-track"><div id="bar-ems" class="bar-fill bar-ems"></div></div>
        </div>
      </section>

      <p id="statement" class="statement clip" data-start="0" data-duration="10" data-track-index="6">
        EMS recruta até <em>85–90%</em> das fibras
      </p>

      <div id="facts" class="footer clip" data-start="0" data-duration="10" data-track-index="7">
        <span>20–25 min</span>
        <span>1–3× por semana</span>
        <span>Baixo impacto</span>
      </div>

      <div id="progress" class="progress clip" data-start="0" data-duration="10" data-track-index="8">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </main>

    <script>
      window.__timelines = window.__timelines || {};

      const counter = { value: 0 };
      const metricValue = document.querySelector("#metric-value");
      const timeline = gsap.timeline({ paused: true });

      timeline
        .from(".brand", { opacity: 0, x: -28, duration: 0.65, ease: "power3.out" }, 0.15)
        .from(".eyebrow", { opacity: 0, y: 18, duration: 0.65, ease: "power3.out" }, 0.45)
        .from(".metric", { opacity: 0, scale: 0.7, duration: 0.8, ease: "back.out(1.5)" }, 0.65)
        .to(
          counter,
          {
            value: 90,
            duration: 2.2,
            ease: "power3.out",
            onUpdate: () => {
              metricValue.textContent = `${Math.round(counter.value)}`;
            },
          },
          0.8,
        )
        .from(".metric-label", { opacity: 0, y: 16, duration: 0.65, ease: "power2.out" }, 1.3)
        .from(".chart", { opacity: 0, y: 35, duration: 0.75, ease: "power3.out" }, 1.75)
        .to("#bar-conventional", { scaleX: 1, duration: 1.3, ease: "power3.out" }, 2.2)
        .to("#bar-ems", { scaleX: 1, duration: 1.65, ease: "power3.out" }, 3.05)
        .from("#statement", { opacity: 0, y: 22, duration: 0.9, ease: "power3.out" }, 4.65)
        .from(".footer span", { opacity: 0, y: 12, stagger: 0.16, duration: 0.55, ease: "power2.out" }, 5.6)
        .to("#progress-fill", { scaleX: 1, duration: 10, ease: "none" }, 0);

      window.__timelines["techbody-ems"] = timeline;
    </script>
  </body>
</html>
