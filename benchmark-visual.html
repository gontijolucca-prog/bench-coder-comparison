<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benchmark Content Machine — Visual</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e8e8e8; font-family: -apple-system, sans-serif; padding: 20px; }
h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
.subtitle { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab { padding: 8px 16px; background: #141414; border: 1px solid #222; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #888; }
.tab.active { background: #d4773b; color: #000; border-color: #d4773b; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 1400px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.cli-card { background: #141414; border: 1px solid #222; border-radius: 12px; overflow: hidden; }
.cli-card h3 { padding: 10px 14px; font-size: 0.95rem; font-weight: 700; border-bottom: 1px solid #222; }
.cli-card .model { font-size: 0.7rem; color: #888; font-weight: 400; }
.iframe-wrap { position: relative; width: 100%; overflow: hidden; }
.iframe-wrap iframe { width: 100%; border: none; transform-origin: top left; }
.carousel-frame { height: 8100px; }
.carousel-frame iframe { height: 8100px; }
.reel-frame { height: 1920px; }
.reel-frame iframe { height: 1920px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>

<h1>Benchmark Content Machine — Visual</h1>
<p class="subtitle">TechBody · MiniMax-M3 · 4 CLIs · Carrossel + Reel animado</p>

<div class="tabs">
  <div class="tab active" onclick="showTab('carousel', this)">Carrossel</div>
  <div class="tab" onclick="showTab('reel', this)">Reel animado</div>
</div>

<div id="tab-carousel" class="tab-content active">
<div class="grid">
  <div class="cli-card"><h3>Pi <span class="model">· MiniMax-M3</span></h3><div class="iframe-wrap carousel-frame"><iframe src="bench-content/pi/carousel.html" loading="lazy"></iframe></div></div>
  <div class="cli-card"><h3>Claude Code <span class="model">· MiniMax-M3</span></h3><div class="iframe-wrap carousel-frame"><iframe src="bench-content/claude/carousel.html" loading="lazy"></iframe></div></div>
  <div class="cli-card"><h3>Codex <span class="model">· MiniMax-M3</span></h3><div class="iframe-wrap carousel-frame"><iframe src="bench-content/codex/carousel.html" loading="lazy"></iframe></div></div>
  <div class="cli-card"><h3>OpenCode <span class="model">· MiniMax-M3</span></h3><div class="iframe-wrap carousel-frame"><iframe src="bench-content/opencode/carousel.html" loading="lazy"></iframe></div></div>
</div>
</div>

<div id="tab-reel" class="tab-content">
<div class="grid">
  <div class="cli-card"><h3>Pi <span class="model">· MiniMax-M3</span></h3><div class="iframe-wrap reel-frame"><iframe src="bench-content/pi/reel.html" loading="lazy"></iframe></div></div>
  <div class="cli-card"><h3>Claude Code <span class="model">· MiniMax-M3</span></h3><div class="iframe-wrap reel-frame"><iframe src="bench-content/claude/reel.html" loading="lazy"></iframe></div></div>
  <div class="cli-card"><h3>Codex <span class="model">· MiniMax-M3</span></h3><div class="iframe-wrap reel-frame"><iframe src="bench-content/codex/reel.html" loading="lazy"></iframe></div></div>
  <div class="cli-card"><h3>OpenCode <span class="model">· MiniMax-M3</span></h3><div class="iframe-wrap reel-frame"><iframe src="bench-content/opencode/reel.html" loading="lazy"></iframe></div></div>
</div>
</div>

<script>
function showTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');
}
</script>
</body>
</html>
