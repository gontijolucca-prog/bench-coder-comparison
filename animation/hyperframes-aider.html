<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyperframes Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      background: #050505;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: 800px;
      height: 400px;
      background: #0a0a0a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .title {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #f5f5f5;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 10;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .circle {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      top: 50%;
      left: 0;
      margin-top: -30px;
      will-change: transform, opacity;
      animation: moveBounceScale 4s ease-in-out infinite;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .c1 { background: #FF6B5B; animation-delay: 0s; }
    .c2 { background: #4ADE80; animation-delay: 0.4s; }
    .c3 { background: #60A5FA; animation-delay: 0.8s; }

    @keyframes moveBounceScale {
      0% {
        transform: translateX(0px) translateY(0px) scale(0.6);
        opacity: 0;
      }
      15% { opacity: 1; }
      25% {
        transform: translateX(180px) translateY(-60px) scale(1.1);
      }
      50% {
        transform: translateX(370px) translateY(0px) scale(1);
        opacity: 1;
      }
      75% {
        transform: translateX(560px) translateY(-50px) scale(0.9);
      }
      90% { opacity: 1; }
      100% {
        transform: translateX(740px) translateY(0px) scale(0.6);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="title">Hyperframes Animation</div>
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
  </div>
</body>
</html>
