<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hyperframes Animation — Hermes</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html, body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #0f1419 0%, #050505 80%);
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
    color: #f5f5f5;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 800px;
    height: 400px;
    background: #0a0a0a;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .title {
    position: absolute;
    top: 24px;
    left: 32px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    z-index: 10;
  }
  .subtitle {
    position: absolute;
    top: 24px;
    right: 32px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    z-index: 10;
  }
  .baseline {
    position: absolute;
    bottom: 50px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }
  .circle {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    bottom: 50px;
    left: 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .c1 { background: radial-gradient(circle at 30% 30%, #FF8E80, #FF6B5B); animation: hb1 3.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  .c2 { background: radial-gradient(circle at 30% 30%, #6FFF9D, #4ADE80); animation: hb2 3.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite 0.4s; }
  .c3 { background: radial-gradient(circle at 30% 30%, #7FBFFF, #60A5FA); animation: hb3 3.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite 0.8s; }
  @keyframes hb1 {
    0% { left: 60px; transform: translateY(0) scale(1); }
    25% { left: 50%; transform: translateY(-90px) scale(1.2); }
    50% { left: calc(100% - 120px); transform: translateY(0) scale(1); }
    75% { left: 50%; transform: translateY(-90px) scale(0.85); }
    100% { left: 60px; transform: translateY(0) scale(1); }
  }
  @keyframes hb2 {
    0% { left: 60px; transform: translateY(0) scale(1); }
    25% { left: 50%; transform: translateY(-110px) scale(1.15); }
    50% { left: calc(100% - 120px); transform: translateY(0) scale(0.95); }
    75% { left: 50%; transform: translateY(-110px) scale(0.9); }
    100% { left: 60px; transform: translateY(0) scale(1); }
  }
  @keyframes hb3 {
    0% { left: 60px; transform: translateY(0) scale(1); }
    25% { left: 50%; transform: translateY(-100px) scale(1.1); }
    50% { left: calc(100% - 120px); transform: translateY(0) scale(0.9); }
    75% { left: 50%; transform: translateY(-100px) scale(0.8); }
    100% { left: 60px; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="title">Hermes Agent — Hyperframes</div>
    <div class="subtitle">800×400 · 3 Channels</div>
    <div class="baseline"></div>
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
  </div>
</body>
</html>
